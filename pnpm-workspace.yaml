# Supply-chain defense: pnpm refuses any package version published less than a
# day ago. Most malicious releases are caught and pulled within hours. To take an
# urgent fix sooner, list that package under minimumReleaseAgeExclude and remove
# it again once the day has passed. Do not disable this setting.
minimumReleaseAge: 1440

packages:
  - apps/dashboard

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - esbuild

overrides:
  # Held at the version the build was verified with.
  esbuild: "0.28.2"

[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.0.53",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "marketsignalos-api[dev]",
    "marketsignalos-polymarket[dev,benchmark]",
]

[tool.uv.sources]
marketsignalos-api = { path = ".migration-backup/apps/api", editable = true }
marketsignalos-polymarket = { path = ".migration-backup/services/polymarket-ingestor", editable = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["TRY004"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = true
mypy_path = [".migration-backup/apps/api/src", ".migration-backup/services/polymarket-ingestor/src"]

[tool.pytest.ini_options]
testpaths = [".migration-backup/apps/api/tests", ".migration-backup/services/polymarket-ingestor/tests", "artifacts/api-server/tests", "scripts/tests"]
pythonpath = [".migration-backup/apps/api/src", ".migration-backup/services/polymarket-ingestor/src"]

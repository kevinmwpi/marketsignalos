[project]
name = "marketsignalos"
version = "0.1.0"
description = "Polymarket wallet research: ingestion, Bayesian skill scoring and a public dashboard"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "psutil>=7.2.2",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.0.53",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "marketsignalos-api[dev]",
    "marketsignalos-polymarket[dev,benchmark]",
]

[tool.uv.sources]
marketsignalos-api = { path = "apps/api", editable = true }
marketsignalos-polymarket = { path = "services/polymarket-ingestor", editable = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["TRY004"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = true
mypy_path = ["apps/api/src", "services/polymarket-ingestor/src"]
# Research-snapshot collection and publication predate strict typing of scripts/.
# Everything else under scripts/ is checked; remove entries here as they are typed.
exclude = [
    "^scripts/collect_research_snapshot\\.py$",
    "^scripts/publish_research_snapshot\\.py$",
    "^scripts/tests/test_research_publication\\.py$",
    "^scripts/tests/test_research_snapshot\\.py$",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "services/polymarket-ingestor/tests", "scripts/tests"]
pythonpath = ["apps/api/src", "services/polymarket-ingestor/src"]

[build]
# Railway's Railpack can install Python dependencies from requirements.txt
# in the repository root. Use direct package deps so Railpack does not need
# to copy nested monorepo paths during pip install.
builder = "RAILPACK"

[deploy]
startCommand = "./scripts/start-api.sh"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

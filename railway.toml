[build]
# Railway's Railpack can install Python dependencies from requirements.txt
# in the repository root. In this monorepo, that file points to apps/api.
builder = "RAILPACK"

[deploy]
startCommand = "uvicorn marketsignalos_api.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

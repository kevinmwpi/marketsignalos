[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketsignalos-polymarket"
version = "0.1.0"
description = "Polymarket ingestion workers for MarketSignalOS"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "httpx",
  "prometheus-client",
  "psycopg2-binary>=2.9",
  "sqlalchemy>=2.0",
]

[project.scripts]
marketsignalos-polymarket-ingestor = "marketsignalos_polymarket.runner:main"

[project.optional-dependencies]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

# psycopg2-binary ships no type stubs and the Postgres write path is opt-in,
# so exempt just that import instead of relaxing strictness package-wide.
[[tool.mypy.overrides]]
module = ["psycopg2", "psycopg2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "python artifacts/api-server/start.py"

[services.production]

[services.production.build]
args = ["uv", "sync", "--frozen", "--no-dev"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Preview and publishing must run the same imported Python API.
args = [".venv/bin/python", "artifacts/api-server/start.py"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
APP_ENV = "production"
INGEST_EVERY_MINUTES = "0"
FASTLANE_EVERY_SECONDS = "0"
INGEST_POLYMARKET = "0"

[services.production.health.startup]
path = "/api/healthz"

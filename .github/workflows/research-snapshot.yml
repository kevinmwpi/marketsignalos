name: Refresh public research snapshot

on:
  schedule:
    # UTC; four small captures per day, away from the top of the hour.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-research-snapshot
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'kevinmwpi/marketsignalos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Install locked Python dependencies
        run: uv sync --frozen --no-dev
      - name: Collect one bounded sample
        run: uv run --no-sync python scripts/collect_research_snapshot.py --run --wallet-limit 10 --max-seconds 180 --output /tmp/research-snapshot.json
      - name: Publish complete capture to the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/publish_research_snapshot.py /tmp/research-snapshot.json

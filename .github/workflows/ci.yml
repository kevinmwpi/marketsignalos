name: Integration checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.12.3"
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --frozen
      - name: Check backend style
        run: uv run --no-sync ruff check apps/api services/polymarket-ingestor scripts
      - name: Check cross-package types, including tests
        run: uv run --no-sync mypy apps/api services/polymarket-ingestor scripts --config-file pyproject.toml
      - name: Test the API, the ingestor and the research scripts
        run: uv run --no-sync pytest -q

  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - run: npm install --global pnpm@10.26.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @marketsignalos/dashboard run typecheck
      - name: Test snapshot loading, fallback and API selection
        run: pnpm --filter @marketsignalos/dashboard run test
      - run: pnpm --filter @marketsignalos/dashboard run build
        env:
          NODE_ENV: production

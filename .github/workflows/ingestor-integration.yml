name: ingestor-integration

on:
  pull_request:
    paths:
      - "services/ingestor/**"
      - "apps/api/**"
      - ".github/workflows/ingestor-integration.yml"
  workflow_dispatch:

jobs:
  ingestor-and-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ingestor deps
        working-directory: services/ingestor
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ingestor tests
        working-directory: services/ingestor
        run: pytest -q

      - name: Install api deps
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: API tests
        working-directory: apps/api
        run: pytest -q

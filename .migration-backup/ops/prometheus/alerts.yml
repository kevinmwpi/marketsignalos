# Prometheus alerting rules for MarketSignalOS.
#
# The first group is derived, one alert at a time, from the post-mortems in
# docs/fix-lessons-learned.md. Each of those four failures ran undetected for
# hours to weeks, and none of them was invisible for lack of data — the numbers
# were being computed and in three cases logged. They were invisible because
# nothing evaluated them. These rules do the evaluating.
#
# Load with:
#   rule_files:
#     - /etc/prometheus/alerts.yml
#
# Validate with:
#   promtool check rules ops/prometheus/alerts.yml
#
# Every metric referenced here is asserted to exist by
# apps/api/tests/test_alert_rules.py, so renaming a collector fails CI rather
# than silently disarming an alert.

groups:
  # ── Regression guards for incidents that actually happened ────────────────
  - name: marketsignalos-incident-regressions
    interval: 1m
    rules:
      # Post-mortem 2026-07-07. _market_winning_outcome required a Gamma flag
      # combination (closed=true AND active=false) that never occurs, so every
      # enrichment from 2026-06-02 onward computed resolved_bets=0. No skill
      # scores, empty feed, a ledger that never settled a single row — for six
      # weeks, through a green test suite.
      #
      # The wallets>0 conjunct is what makes this safe to alert on: it proves
      # enrichment actually ran and scored wallets. Without it the rule would
      # fire on every fresh deploy, when the gauge is legitimately 0 because
      # nothing has run yet — and an alert that cries wolf at boot is an alert
      # someone silences before it ever catches the real thing.
      - alert: EnrichmentProducesNoResolvedBets
        expr: msos_enrichment_resolved_bets == 0 and msos_enrichment_wallets > 0
        for: 15m
        labels:
          severity: critical
          incident: "2026-07-07"
        annotations:
          summary: "Enrichment scored {{ $value }} wallets but found no resolved bets"
          description: >-
            The skill model has no settled outcomes to fit against, so
            skill_likelihood carries no information and the skilled-bets feed
            will be empty or arbitrary. This is the signature of a settlement
            predicate that no longer matches upstream data — verify the
            closed/winner detection in skill_computation._market_winning_outcome
            against a real Gamma snapshot before assuming the market data is at
            fault.
          runbook: docs/observability.md#enrichmentproducesnoresolvedbets

      # Post-mortem 2026-07-14. An undamped Newton step diverged on a
      # near-separable wallet, producing MLEs of 1e3-1e5 that poisoned the
      # empirical-Bayes population prior to (mu=67.6, sigma2=1.07e7). mu=67
      # log-odds is a ~1e29 odds ratio; it was logged every single run.
      #
      # The domain bound is physical, not statistical: bayesian_skill clamps
      # per-wallet edges to |edge| <= 20 log-odds and caps the population
      # variance at _MAX_SIGMA2_POP = 4.0. A fitted prior outside that range
      # means the guards themselves have been bypassed or regressed.
      - alert: PopulationPriorOutOfDomain
        expr: abs(msos_population_prior_mu) > 5 or msos_population_prior_sigma2 > 4
        for: 5m
        labels:
          severity: critical
          incident: "2026-07-14"
        annotations:
          summary: "Empirical-Bayes prior left its physical domain (mu={{ with query \"msos_population_prior_mu\" }}{{ . | first | value | printf \"%.3f\" }}{{ end }})"
          description: >-
            A fitted hyperparameter feeding the same fitter that produced it is
            a feedback loop: one diverging sub-fit destroys the whole
            population. Check the damping and line search in
            fit_wallet_posterior and the moment clamps in
            population_prior_from_fits.
          runbook: docs/observability.md#populationprioroutofdomain

      # The same incident, caught from the output side rather than the
      # parameter side. The divergence ended with skill_likelihood >= 0.999 for
      # 500 of 500 leaderboard wallets: the score stopped discriminating
      # entirely and the feed silently degraded to ranking wallets by volume.
      #
      # Worth having both: a fit can stop discriminating without the prior
      # leaving its domain (a saturating likelihood, a degenerate input set),
      # and this rule catches the failure by its product-visible symptom
      # regardless of mechanism. Healthy production sits near 0.01.
      - alert: SkillScoreNotDiscriminating
        expr: msos_skill_likelihood_saturated_ratio > 0.5
        for: 15m
        labels:
          severity: critical
          incident: "2026-07-14"
        annotations:
          summary: "{{ $value | humanizePercentage }} of wallets have skill_likelihood > 0.999"
          description: >-
            When most wallets look maximally skilled the score is carrying no
            information, whatever the fit reports about convergence. The feed
            is effectively selecting on volume. Expected steady state is ~1%.
          runbook: docs/observability.md#skillscorenotdiscriminating

      # Post-mortem 2026-07-13. Whale hydration accumulated entire activity
      # histories in RAM; four concurrent whales plus the ~5 GB dedupe index
      # pushed a deep run to 18 GB private on a 15.7 GB machine. It thrashed
      # the pagefile for 13.5 hours making zero disk progress at ~20% CPU —
      # no error, no log output, a process that looked healthy, and /health
      # timing out because the event loop had starved.
      #
      # Nothing about that is visible from liveness or error rate, which is why
      # progress has to be asserted positively by the work itself. Every stage
      # transition and every persisted activity page stamps the progress gauge;
      # a run in flight that has not stamped it in 30 minutes is wedged, and
      # the pipeline_running conjunct keeps an idle deployment quiet.
      - alert: PipelineStalled
        expr: msos_pipeline_running == 1 and (time() - msos_pipeline_progress_timestamp_seconds) > 1800
        for: 5m
        labels:
          severity: critical
          incident: "2026-07-13"
        annotations:
          summary: "Pipeline in flight with no progress for {{ $value | humanizeDuration }}"
          description: >-
            A run is marked running but has persisted nothing and crossed no
            stage boundary. Historically this is memory thrash, not a hang:
            check msos_pipeline_stage_rss_bytes first, then take a py-spy dump
            of the worker process before assuming deadlock or dead sockets.
          runbook: docs/observability.md#pipelinestalled

      # Post-mortem 2026-07-13, the leading indicator rather than the symptom.
      # Set the threshold to roughly 70% of the container memory limit; the
      # default here suits a 12 GB Railway instance.
      - alert: PipelineMemoryHighWater
        expr: max(msos_pipeline_stage_rss_bytes) > 8e9
        for: 10m
        labels:
          severity: warning
          incident: "2026-07-13"
        annotations:
          summary: "Pipeline stage RSS at {{ $value | humanize1024 }}B"
          description: >-
            Resident set is approaching the container limit. Past this point the
            failure mode is swap thrash rather than a clean OOM, which presents
            as an indefinite stall. Reduce POLYMARKET_WALLET_CONCURRENCY and
            audit any path that materializes the full activity dataset.
          runbook: docs/observability.md#pipelinememoryhighwater

      # Post-mortem 2026-07-10. httpx accumulated every Cloudflare cookie
      # variant in the shared client's jar, and request *construction* walks the
      # whole jar (http.cookiejar.deepvalues). After tens of thousands of
      # requests each new request cost minutes of pure CPU before a socket was
      # ever touched. Deep runs appeared to freeze: no error, no log line, and a
      # process that py-spy showed as active+gil rather than blocked on I/O.
      #
      # This is why msos_upstream_request_build_seconds is measured separately
      # from transport. A combined round-trip timer shows only "requests got
      # slow", which is exactly the reading that sent the original
      # investigation through three wrong theories. Normal build time is
      # microseconds, so a p99 above half a second is unambiguous.
      - alert: UpstreamRequestBuildSlow
        expr: >-
          histogram_quantile(
            0.99,
            sum by (le, host) (rate(msos_upstream_request_build_seconds_bucket[10m]))
          ) > 0.5
        for: 10m
        labels:
          severity: critical
          incident: "2026-07-10"
        annotations:
          summary: "Request construction p99 is {{ $value | humanizeDuration }} for {{ $labels.host }}"
          description: >-
            Time is going into building requests, not sending them, so upstream
            is not the problem. Check the client cookie jar first
            (msos_http_client_cookie_jar_size) — per-request cost that grows
            with total requests issued is the known signature.
          runbook: docs/observability.md#upstreamrequestbuildslow

      # The same incident's root cause, watched directly. The jar is cleared
      # after every response because these APIs are cookie-free, so a nonzero
      # steady-state reading means that clear has regressed. Sampled before the
      # clear, so a handful of cookies per response is normal and sustained
      # growth is not.
      - alert: HttpClientCookieJarGrowing
        expr: msos_http_client_cookie_jar_size > 50
        for: 10m
        labels:
          severity: warning
          incident: "2026-07-10"
        annotations:
          summary: "Upstream client cookie jar holding {{ $value }} cookies"
          description: >-
            Cookies are accumulating on the shared httpx client. Request build
            cost grows with jar size, degrading long backfills to a crawl.
            Verify the cookies.clear() calls in PolymarketClient are intact.
          runbook: docs/observability.md#httpclientcookiejargrowing

  # ── Service level objectives ──────────────────────────────────────────────
  # Freshness is a product feature here, so it gets an SLO rather than living
  # only in a docstring.
  - name: marketsignalos-slo
    interval: 1m
    rules:
      # No successful shallow run in three hours. The series is created on
      # first success, so this cannot fire on a deployment that has never run
      # the pipeline, and it stays quiet when the scheduler is disabled only
      # until the first manual run establishes the baseline.
      - alert: SignalsStale
        expr: (time() - msos_pipeline_last_success_timestamp_seconds{kind="shallow"}) > 10800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No successful ingest for {{ $value | humanizeDuration }}"
          description: >-
            Every downstream artifact — ledger rows, CLV price snapshots, exit
            diffs, webhook deliveries — accrues only when ingest runs. Stale
            ingest silently freezes all of them. Check INGEST_EVERY_MINUTES and
            /ingestor/status.
          runbook: docs/observability.md#signalsstale

      - alert: PipelineRunsFailing
        expr: >-
          sum(increase(msos_pipeline_runs_total{outcome="failure"}[1h])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} pipeline runs failed in the last hour"
          runbook: docs/observability.md#pipelinerunsfailing

      # The cold feed path walked the whole activity file for ~400 s and could
      # exceed 15 minutes, so a served request past 30 s means the cache
      # layers are missing and users are waiting on a full recompute.
      - alert: FeedLatencyHigh
        expr: >-
          histogram_quantile(
            0.99,
            sum by (le) (rate(msos_http_request_duration_seconds_bucket{path="/signals/skilled-bets"}[10m]))
          ) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Skilled-bets p99 latency is {{ $value | humanizeDuration }}"
          description: >-
            Requests are falling through to a full recompute. Check
            msos_feed_cache_events_total for the layer that stopped hitting;
            a cold process with no disk artifact is the usual cause.
          runbook: docs/observability.md#feedlatencyhigh

      - alert: ApiErrorRateHigh
        expr: >-
          sum(rate(msos_http_requests_total{status="5xx"}[10m]))
            / clamp_min(sum(rate(msos_http_requests_total[10m])), 0.001)
            > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value | humanizePercentage }} of API requests are 5xx"
          runbook: docs/observability.md#apierrorratehigh

      # Upstream health, kept distinct from our own errors: this one is
      # actionable by backing off, not by shipping a fix.
      - alert: UpstreamErrorRateHigh
        expr: >-
          sum by (host) (rate(msos_upstream_requests_total{outcome=~"server_error|transport_error"}[10m]))
            / clamp_min(sum by (host) (rate(msos_upstream_requests_total[10m])), 0.001)
            > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} of requests to {{ $labels.host }} are failing"
          runbook: docs/observability.md#upstreamerrorratehigh

      # Ingest is bound by a shared upstream budget, not by CPU. When workers
      # spend most of their time queued behind that budget, adding workers
      # cannot help — this alert exists to stop exactly that reflex.
      - alert: RateLimiterSaturated
        expr: >-
          histogram_quantile(
            0.5,
            sum by (le) (rate(msos_rate_limiter_wait_seconds_bucket[10m]))
          ) > 2
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Median rate-limit wait is {{ $value | humanizeDuration }}"
          description: >-
            Workers are queued behind the shared upstream budget rather than
            doing work. Ingest throughput is limited by POLYMARKET_API_RPS, not
            by concurrency; raising POLYMARKET_WALLET_CONCURRENCY will not help
            and risks upstream rate limiting.
          runbook: docs/observability.md#ratelimitersaturated

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketsignalos-api"
version = "0.1.0"
description = "MarketSignalOS FastAPI service"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "httpx",
  "prometheus-client",
  "psycopg2-binary>=2.9",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "httpx",
  # Pinned deliberately — see the note in
  # services/polymarket-ingestor/pyproject.toml. Keep the two packages on the
  # same versions so a check that passes in one job passes in the other.
  "mypy==2.3.1",
  "pytest",
  "ruff==0.16.4",
  # tests/test_alert_rules.py parses ops/prometheus/alerts.yml so a renamed
  # collector fails CI instead of silently disarming an alert.
  "pyyaml",
  "types-PyYAML",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# See the rationale in services/polymarket-ingestor/pyproject.toml — kept in
# sync so the two packages lint under the same rules.
ignore = ["TRY004"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

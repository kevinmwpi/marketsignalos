# Alembic configuration for MarketSignalOS Polymarket ingestor schema.
# Run migrations with: alembic upgrade head
# (from the services/polymarket-ingestor/ directory with DATABASE_URL set)

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# DATABASE_URL is injected at runtime by alembic/env.py from the environment.
# Do not hardcode credentials here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

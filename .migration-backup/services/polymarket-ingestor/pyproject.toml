[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketsignalos-polymarket"
version = "0.1.0"
description = "Polymarket ingestion workers for MarketSignalOS"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "httpx",
  "prometheus-client",
  "psycopg2-binary>=2.9",
  "sqlalchemy>=2.0",
]

[project.scripts]
marketsignalos-polymarket-ingestor = "marketsignalos_polymarket.runner:main"

[project.optional-dependencies]
dev = [
  # Pinned deliberately. Both are gate-keeping linters run in CI, and both
  # expand what they check between releases — ruff 0.16.0 (2026-07-23) widened
  # its default rule set and turned a green main red without a single line of
  # code changing. An unpinned linter makes CI a function of the calendar
  # rather than of the commit. Bump these on purpose, with the fixes in the
  # same PR.
  "mypy==2.3.1",
  "pytest",
  "ruff==0.16.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# TRY004 wants TypeError wherever a guard checks a type. These guards check the
# *shape of a payload an external API returned* ("Expected list from /markets,
# got dict"), which is a bad value, not a caller passing the wrong type — and
# they sit alongside argument-validation guards in the same functions that
# already raise ValueError, with tests asserting it. Converting them would be a
# behaviour change across the client and storage layers in service of a style
# opinion, so the convention stays ValueError.
ignore = ["TRY004"]

[tool.mypy]
python_version = "3.12"
strict = true

# psycopg2-binary ships no type stubs and the Postgres write path is opt-in,
# so exempt just that import instead of relaxing strictness package-wide.
[[tool.mypy.overrides]]
module = ["psycopg2", "psycopg2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
